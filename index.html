<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNU 교육과정 탐색관</title>
<style>
body{font-family:Pretendard,Arial,sans-serif;margin:0;background:#f6f8fb;color:#222}
header{background:#fff;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:sticky;top:0}
.container{max-width:1200px;margin:auto}
h1{margin:0}
.search{display:flex;gap:10px;margin-top:15px}
input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px}
button{padding:14px 20px;border:none;background:#0057b8;color:#fff;border-radius:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:30px}
.card{background:white;padding:30px;border-radius:20px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.06);transition:.2s}
.card:hover{transform:translateY(-4px)}
.hidden{display:none}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px}
.year{background:white;border-radius:18px;padding:20px}
.course{background:#eef4ff;padding:8px;margin:8px 0;border-radius:10px}
.back{margin:20px}
.tag{display:inline-block;background:#eef4ff;padding:6px 10px;border-radius:20px;margin:3px}
</style>
</head>
<body>

<header>
<div class="container">
<h1>🎓 부산대학교 교육과정 탐색관</h1>
<div class="search">
<input id="searchInput" placeholder="학과명을 입력하세요">
<button onclick="searchDept()">검색</button>
</div>
</div>
</header>

<div id="collegeView">
<div class="grid">
<div class="card" onclick="openCollege('사범대학')">🎓 사범대학</div>
<div class="card">⚙️ 공과대학</div>
<div class="card">🧪 자연과학대학</div>
<div class="card">📚 인문대학</div>
<div class="card">💼 경영대학</div>
<div class="card">🌎 사회과학대학</div>
</div>
</div>

<div id="deptView" class="hidden">
<button class="back" onclick="showColleges()">← 돌아가기</button>
<div class="grid" id="deptGrid"></div>
</div>

<div id="majorView" class="hidden">
<button class="back" onclick="backToDept()">← 학과목록</button>
<div class="container">
<h2 id="majorTitle"></h2>
<p id="majorDesc"></p>
<div id="tags"></div>

<h3>교육과정 로드맵</h3>
<div class="roadmap" id="roadmap"></div>
</div>
</div>

<script>
const data={
"사범대학":[
{
name:"국어교육과",
desc:"국어교육 전문가 양성",
tags:["국어교육","문학교육","교사양성","리터러시"],
roadmap:{
"1학년":["논술과작문교육론","국어학의이해","국문학원전이해","현대문학개론"],
"2학년":["국어문법론","문학교육론","국문학개론","고전소설론"],
"3학년":["국문학사","국어교육론","국어사","매체교육론"],
"4학년":["독서교육론","문학교육연습","국어교재연구및지도법","리터러시의이해"]
}
},
{
name:"영어교육과",
desc:"영어교육 및 글로벌 의사소통 전문가 양성",
tags:["영어교육","영문학","언어교육","교사양성"],
roadmap:{
"1학년":["영어회화Ⅰ","영문학개론","영어작문연습","영어학개론"],
"2학년":["영어습득과통사론","응용영어음운론","영미문화의이해"],
"3학년":["영어교육이론과실제","영어능력평가","제2언어습득"],
"4학년":["영어교재연구및지도법","영어담화분석","영어교육문법"]
}
}
]
};

let currentCollege="";

function openCollege(name){
currentCollege=name;
document.getElementById("collegeView").classList.add("hidden");
document.getElementById("deptView").classList.remove("hidden");

let html="";
(data[name]||[]).forEach(d=>{
html+=`<div class="card" onclick="openMajor('${d.name}')">${d.name}</div>`;
});
document.getElementById("deptGrid").innerHTML=html;
}

function openMajor(name){
const dept=data[currentCollege].find(x=>x.name===name);
document.getElementById("deptView").classList.add("hidden");
document.getElementById("majorView").classList.remove("hidden");

majorTitle.innerText=dept.name;
majorDesc.innerText=dept.desc;

tags.innerHTML=dept.tags.map(t=>`<span class='tag'>#${t}</span>`).join("");

let road="";
for(const year in dept.roadmap){
road+=`<div class='year'><h3>${year}</h3>`;
dept.roadmap[year].forEach(c=>road+=`<div class='course'>${c}</div>`);
road+="</div>";
}
roadmap.innerHTML=road;
}

function showColleges(){
collegeView.classList.remove("hidden");
deptView.classList.add("hidden");
}

function backToDept(){
majorView.classList.add("hidden");
deptView.classList.remove("hidden");
}

function searchDept(){
const q=document.getElementById("searchInput").value.trim();
for(const college in data){
const found=data[college].find(d=>d.name.includes(q));
if(found){
currentCollege=college;
openMajor(found.name);
return;
}
}
alert("검색 결과가 없습니다.");
}
</script>
</body>
</html>
