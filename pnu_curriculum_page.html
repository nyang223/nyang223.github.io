<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026학년도 학부 교육과정 안내</title>
  <style>
    :root{--pnu:#005bac;--pnu2:#003e7e;--sky:#eaf5ff;--ink:#172033;--muted:#687386;--line:#dde7f2;--card:#fff;--bg:#f6f9fd;--mint:#e9fbf6;--yellow:#fff7df;--pink:#fff1f5}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--ink)}.hero{background:linear-gradient(135deg,var(--pnu2),var(--pnu));color:white;padding:56px 24px 44px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:310px;height:310px;border-radius:50%;background:rgba(255,255,255,.12)}.wrap{max-width:1180px;margin:0 auto}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);padding:8px 12px;border-radius:999px;font-size:14px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:18px 0 12px;letter-spacing:-.04em}.hero p{font-size:18px;line-height:1.7;margin:0;max-width:760px;color:#e9f3ff}.toolbar{margin-top:-28px;position:relative;z-index:2}.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,63,126,.12);border-radius:24px;padding:18px;display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:12px}.input,.select{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;padding:0 16px;font-size:15px;background:#fff}.main{padding:32px 24px 70px}.grid{display:grid;grid-template-columns:300px 1fr;gap:22px}.side{position:sticky;top:18px;align-self:start}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(20,49,85,.06)}.side .card{padding:16px}.deptBtn{width:100%;text-align:left;border:0;background:transparent;padding:14px 13px;border-radius:14px;cursor:pointer;margin:2px 0;color:var(--ink)}.deptBtn:hover,.deptBtn.active{background:var(--sky);color:var(--pnu2)}.deptBtn b{display:block;font-size:15px}.deptBtn span{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.content{display:flex;flex-direction:column;gap:18px}.deptHead{padding:24px}.deptHead h2{margin:0 0 6px;font-size:30px;letter-spacing:-.03em}.deptHead .en{color:var(--muted);margin-bottom:18px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:999px;padding:7px 11px;font-size:13px;background:var(--sky);color:var(--pnu2);font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:26px;color:var(--pnu2)}.section{padding:22px}.section h3{margin:0 0 14px;font-size:20px}.goal{line-height:1.75;color:#30394a;background:#f9fbfe;border-radius:18px;padding:18px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700;color:#526075}.tab.active{background:var(--pnu);color:#fff;border-color:var(--pnu)}.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.course{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.course .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:9px}.course b{font-size:16px}.course p{margin:8px 0 0;color:#4d596b;font-size:14px;line-height:1.6}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{background:linear-gradient(90deg,var(--yellow),#fff);border:1px solid #ffe2a1;border-radius:20px;padding:16px;line-height:1.65;color:#5a4620}.footer{color:var(--muted);font-size:13px;line-height:1.7;text-align:center;padding-top:24px}@media(max-width:900px){.panel{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.side{position:static}.summary{grid-template-columns:repeat(2,1fr)}.courses{grid-template-columns:1fr}}@media(max-width:560px){.summary{grid-template-columns:1fr}.hero{padding-top:36px}.main{padding-left:14px;padding-right:14px}.deptHead h2{font-size:25px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="eyebrow">PNU Curriculum Guide · 2026</div><h1>2026학년도<br/>학부 교육과정 한눈에 보기</h1><p>학과별 교육목표, 졸업기준 학점, 전공기초·전공필수·전공선택 교과목을 카드형 UI로 탐색할 수 있는 안내 페이지입니다.</p></div></header>
  <div class="wrap toolbar"><div class="panel"><input id="search" class="input" placeholder="학과명·교과목명·교과목번호 검색"/><select id="college" class="select"><option value="all">전체 단과대학</option></select><select id="grade" class="select"><option value="all">전체 학년/학기</option><option>1-1</option><option>1-2</option><option>2-1</option><option>2-2</option><option>3-1</option><option>3-2</option><option>4-1</option><option>4-2</option></select></div></div>
  <main class="main wrap"><div class="grid"><aside class="side"><div class="card"><div class="notice"><b>활용 방법</b><br/>왼쪽에서 학과를 선택하고, 상단 검색창으로 과목명·코드·학년학기를 바로 찾을 수 있습니다.</div><div id="deptList" style="margin-top:14px"></div></div></aside><section class="content"><article class="card deptHead" id="deptHead"></article><div class="summary" id="summary"></div><article class="card section"><h3>교육목적 및 교육목표</h3><div class="goal" id="goals"></div></article><article class="card section"><h3>교육과정</h3><div class="tabs" id="tabs"></div><div class="courses" id="courses"></div></article><article class="card section"><h3>교과요목</h3><div class="courses" id="descriptions"></div></article></section></div><p class="footer">※ 본 페이지는 업로드된 2026 학부 교육과정 HWP를 웹 안내용으로 재구성한 예시입니다. 실제 게시 전 학과별 전체 데이터와 최종 고시 내용을 확인해 주세요.</p></main>
<script>
const DATA=[
{college:'사범대학',dept:'국어교육과',en:'Department of Korean Language Education',credits:{core:9,balance:'12(3)',creative:6,majorBase:12,majorReq:24,majorSel:17,advanced:21,general:12,teaching:22,total:135},goals:['국어교과에 관한 전문적인 지식을 갖춘다.','국어교과의 효과적인 교수방법을 익혀 활용할 수 있다.','국어교육학의 연구 흐름과 교육현장에 대한 이해를 갖춘다.'],courses:[['전공기초','KE1600579','논술과 작문교육론','Principles of teaching argumentative and expository writing','3-3-0','1-1'],['전공기초','KE3600056','국어학의이해','Introduction to Korean Linguistics','3-3-0','1-1'],['전공기초','KE1600577','국문학원전이해','Introduction to Original Texts of Korean Literature','3-3-0','1-2'],['전공기초','KE1600578','현대문학개론','Theory of Modern Korean Literature','3-3-0','1-2'],['전공필수','KE2900407','국어문법론','Modern Korean Grammar','3-3-0','2-1'],['전공필수','KE3400113','문학교육론','Teaching Theories of Modern Korean Literature','3-3-0','2-1'],['전공필수','KE3400233','국어교육론','Introduction to Korean Language Education','3-3-0','3-1'],['전공선택','KE3400758','독서교육론','Reading Education','3-3-0','3-2'],['전공선택','KE3400133','국어교재연구및지도법','Materials and Research Method for Korean Education','3-3-0','4-1']],desc:{'논술과 작문교육론':'문자 언어를 통한 의사 표현 능력을 기르고, 비문학적 글쓰기 유형별 교수학습 활동을 개발한다.','국어학의이해':'국어학에 대한 체계적인 지식을 습득하여 국어 및 문법 수업의 효율적 방법론을 모색한다.','국어교육론':'수업 절차, 수업 목표, 평가 자료 제작 절차를 이해하고 실제 수업 설계 능력을 기른다.'}},
{college:'사범대학',dept:'영어교육과',en:'Department of English Language Education',credits:{core:9,balance:12,creative:6,majorBase:12,majorReq:21,majorSel:20,advanced:21,general:12,teaching:22,total:135},goals:['영어 교사로서 갖추어야 할 품성과 자질을 가진다.','영어 교과에 관한 전문 지식과 효과적인 교수 방법을 익힌다.','영어교육학의 연구 흐름과 교육 현장에 대한 이해를 갖춘다.'],courses:[['전공기초','EG1501176','영어회화(Ⅰ)','English Conversation for Pre-service Teachers(Ⅰ)','3-3-0','1-1'],['전공기초','EG1501185','영문학개론','Introduction to English Literature','3-3-0','1-1'],['전공기초','EG1500582','영어작문연습','English Composition Practice','3-3-0','1-2'],['전공기초','EG2800502','영어학개론','Introduction to English Linguistics','3-3-0','1-2'],['전공필수','EG2200244','영어습득과통사론','English Acquisition & Syntax','3-3-0','2-1'],['전공필수','EG2400022','외국어교수학습론','Theories of Foreign Language Teaching & Learning','3-3-0','3-1'],['전공필수','EG2800550','영어능력평가','Evaluation of English Proficiency','3-3-0','3-2'],['전공선택','EG3800250','영어교육론','Survey of English Education','3-3-0','2-1'],['전공선택','EG2800500','영어교재연구및지도법','Materials and Practices of English Teaching','3-3-0','4-1']],desc:{'영어회화(Ⅰ)':'영어 듣기·말하기 능력을 증진하고 의사소통 능력 신장 전략을 계발한다.','외국어교수학습론':'효과적인 영어 학습 모형을 설계하여 영어교육에 실천적으로 이바지할 수 있도록 한다.','영어능력평가':'중등학교 현장에서 요구되는 영어 평가 내용과 방법을 고안·집행·해석하는 능력을 배양한다.'}},
{college:'사범대학',dept:'독어교육과',en:'Department of German Language Education',credits:{core:9,balance:12,creative:6,majorBase:12,majorReq:21,majorSel:20,advanced:21,general:12,teaching:22,total:135},goals:['교사로서 갖추어야 할 품성과 자질을 가진다.','독어교과교육학의 연구 흐름과 효과적인 교수 방법을 익힌다.','독일어권 문학·어학·문화·역사에 대한 전문 지식을 갖춘다.'],courses:[['전공기초','GR1500944','기초독일어문법','Basic German Grammar','3-3-0','1-1'],['전공기초','GR1600683','독일어권문화입문','Introduction to Culture of German Area','3-3-0','1-1'],['전공기초','GR1500113','독일명작의이해','Understanding of German Masterpieces','3-3-0','1-2'],['전공필수','GR2700759','독일어교육론','Methodology of German Education','3-3-0','2-2'],['전공필수','GR2700983','고급독일어문법','Advanced German Grammar','3-3-0','3-1'],['전공선택','GR2800097','독일어교재연구및지도법','Studies in Teaching Materials and Methodology','3-3-0','3-2'],['전공선택','GR3500439','독일어과논술지도','Essay Writing in German Education','3-3-0','4-1']],desc:{'기초독일어문법':'독일어 기초 문법을 이해하고 응용·활용할 수 있게 한다.','독일어교육론':'독일어 교육의 방법론을 학습하고 교육현장 적용 능력을 기른다.'}},
{college:'정보의생명공학대학',dept:'컴퓨터공학전공',en:'Computer Science and Engineering',credits:{core:10,balance:'9(3)',creative:6,majorBase:25,majorReq:33,majorSel:40,advanced:44,general:6,teaching:22,total:133},goals:['컴퓨터 과학의 기초 이론과 응용 능력을 균형 있게 기른다.','전공기초·전공필수·전공선택 이수 체계를 통해 심화전공 역량을 강화한다.'],courses:[['전공기초','CB1501027','이산수학(Ⅰ)','Discrete Mathematics(Ⅰ)','3-3-0','1-1'],['전공기초','CB1501005','일반물리학(Ⅰ)','General Physics(Ⅰ)','3-3-0','1-1']],desc:{'이산수학(Ⅰ)':'컴퓨터 과학의 여러 분야에 필요한 계수, 논리, 집합론, 관계, 함수 등의 기본 개념을 학습한다.'}},
{college:'첨단융합학부',dept:'나노소자첨단제조전공',en:'Advanced Nano Device Manufacturing',credits:{core:10,balance:15,creative:0,majorBase:25,majorReq:36,majorSel:33,advanced:45,general:6,total:137},goals:['반도체공정 전공트랙 등 첨단 제조 분야의 전공역량을 체계적으로 기른다.','트랙 기반 이수체계를 통해 전공필수와 전공선택을 연계한다.'],courses:[['전공필수','NP2002683','응용공학수학','Applied Engineering Mathematics','3-3-0',''],['전공필수','','나노 Fabrication(Ⅰ)','Nano Fabrication(Ⅰ)','',''],['전공필수','','반도체재료','Semiconductor Materials','',''],['전공선택','','반도체소자','Semiconductor Devices','',''],['전공선택','','반도체패키징','Semiconductor Packaging','','']],desc:{'응용공학수학':'공학 문제 해결에 필요한 수학적 기초와 응용 능력을 기른다.'}},
{college:'첨단융합학부',dept:'광메카트로닉스공학전공',en:'Optical Mechatronics Engineering',credits:{core:10,balance:15,creative:0,majorBase:25,majorReq:36,majorSel:33,advanced:45,general:6,total:137},goals:['광·메카트로닉스 기반 융합기술 역량을 기른다.','AI스마트헬스케어 등 융합트랙 교과목을 통해 진로 맞춤형 학습을 지원한다.'],courses:[['전공선택','','빛과물질','Light and Matter','',''],['전공선택','','바이오재료공학','Biomaterials Engineering','',''],['전공선택','','생체조직공학','Tissue Engineering','',''],['전공선택','','광영상공학','Optical Imaging Engineering','','']],desc:{}}
];
let current=DATA[0], currentTab='전체';
const $=s=>document.querySelector(s); const $$=s=>document.querySelectorAll(s);
function init(){[...new Set(DATA.map(d=>d.college))].forEach(c=>$('#college').insertAdjacentHTML('beforeend',`<option>${c}</option>`)); $('#search').addEventListener('input',render); $('#college').addEventListener('change',render); $('#grade').addEventListener('change',render); render();}
function filteredDepts(){const c=$('#college').value; return DATA.filter(d=>c==='all'||d.college===c)}
function render(){const list=filteredDepts(); if(!list.includes(current)) current=list[0]||DATA[0]; $('#deptList').innerHTML=list.map((d,i)=>`<button class="deptBtn ${d===current?'active':''}" onclick="current=filteredDepts()[${i}];currentTab='전체';render()"><b>${d.dept}</b><span>${d.college} · ${d.en}</span></button>`).join(''); renderDept();}
function renderDept(){ $('#deptHead').innerHTML=`<h2>${current.dept}</h2><div class="en">${current.en}</div><div class="chips"><span class="chip">${current.college}</span><span class="chip">졸업기준 ${current.credits.total}학점</span><span class="chip">전공기초 ${current.credits.majorBase}학점</span></div>`; const c=current.credits; $('#summary').innerHTML=[['효원핵심',c.core],['효원균형',c.balance],['전공필수',c.majorReq],['전공선택',c.majorSel],['심화전공',c.advanced],['일반선택',c.general],['교직',c.teaching||'-'],['졸업기준',c.total]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong><small>학점</small></div>`).join(''); $('#goals').innerHTML='<ol>'+current.goals.map(g=>`<li>${g}</li>`).join('')+'</ol>'; const cats=['전체',...new Set(current.courses.map(x=>x[0]))]; $('#tabs').innerHTML=cats.map(t=>`<button class="tab ${t===currentTab?'active':''}" onclick="currentTab='${t}';renderDept()">${t}</button>`).join(''); const q=$('#search').value.trim().toLowerCase(); const grade=$('#grade').value; let courses=current.courses.filter(x=>(currentTab==='전체'||x[0]===currentTab)&&(grade==='all'||x[5]===grade)&&(!q||x.join(' ').toLowerCase().includes(q)||current.dept.toLowerCase().includes(q))); $('#courses').innerHTML=courses.length?courses.map(courseCard).join(''):'<div class="empty">조건에 맞는 교과목이 없습니다.</div>'; const desc=Object.entries(current.desc||{}).filter(([k,v])=>!q||`${k} ${v}`.toLowerCase().includes(q)); $('#descriptions').innerHTML=desc.length?desc.map(([k,v])=>`<div class="course"><div class="meta"><span>교과요목</span></div><b>${k}</b><p>${v}</p></div>`).join(''):'<div class="empty">등록된 교과요목 요약이 없습니다.</div>';}
function courseCard(x){return `<div class="course"><div class="meta"><span>${x[0]} · ${x[1]||'코드 확인 필요'}</span><span>${x[4]||''} ${x[5]?'· '+x[5]:''}</span></div><b>${x[2]}</b><p>${x[3]||''}</p></div>`}
init();
</script>
</body>
</html>
